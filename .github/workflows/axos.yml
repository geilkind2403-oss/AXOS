name: AXOS image

# Builds the AXOS SD card image (axos.img) for the Raspberry Pi 3.
# Started by hand: Actions > AXOS image > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  BR_VERSION: "2025.02.x"

jobs:
  axos:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Get the pinned AXUS launcher release (axus.lock)
        # axus.lock: line 1 the AXUS release tag, line 2 the sha256 of its
        # tv-launcher-pi.tar.gz. A different file stops the build.
        run: |
          mkdir -p axus
          tag=$(sed -n 1p axus.lock)
          sum=$(sed -n 2p axus.lock)
          curl -fsSL -o axus.tar.gz "https://github.com/geilkind2403-oss/AXUS/releases/download/$tag/tv-launcher-pi.tar.gz"
          echo "$sum  axus.tar.gz" | sha256sum -c -
          echo "AXUS_TAG=$tag" >> "$GITHUB_ENV"
          tar -xzf axus.tar.gz -C axus
          ./axus/pi/tv-launcher --version 2>/dev/null || true
          ls -la axus/pi

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.buildroot-ccache
          key: axos-ccache-${{ env.BR_VERSION }}-${{ hashFiles('configs/**', 'board/**', 'overlay/**') }}-${{ github.run_id }}
          restore-keys: |
            axos-ccache-${{ env.BR_VERSION }}-

      - name: Restore downloads
        uses: actions/cache/restore@v4
        with:
          path: ~/br-dl
          key: axos-dl-${{ env.BR_VERSION }}-${{ github.run_id }}
          restore-keys: axos-dl-${{ env.BR_VERSION }}-

      - name: Get Buildroot
        run: git clone --depth 1 --branch $BR_VERSION https://github.com/buildroot/buildroot ~/buildroot

      - name: Configure
        run: cd ~/buildroot && make BR2_EXTERNAL=$GITHUB_WORKSPACE BR2_DL_DIR=$HOME/br-dl axos_rpi3_defconfig

      - name: Build
        timeout-minutes: 320
        run: |
          cd ~/buildroot
          ( while sleep 600; do echo "... still building ($(date -u +%H:%M))"; done ) &
          set +e
          make BR2_DL_DIR=$HOME/br-dl BR2_JLEVEL=$(nproc) 2>&1 | tee ~/build.log | grep --line-buffered -E '^>>> |Error|error:'
          status=${PIPESTATUS[0]}
          exit $status

      - name: Build log (tail)
        if: always()
        run: tail -n 150 ~/build.log || true

      - name: Save downloads
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/br-dl
          key: axos-dl-${{ env.BR_VERSION }}-${{ github.run_id }}

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.buildroot-ccache
          key: axos-ccache-${{ env.BR_VERSION }}-${{ hashFiles('configs/**', 'board/**', 'overlay/**') }}-${{ github.run_id }}

      - name: Licenses and sources (GPL)
        # every package's license text and its exact source code, as the
        # GPL asks of anyone passing the image on
        run: |
          cd ~/buildroot
          make BR2_DL_DIR=$HOME/br-dl legal-info
          tar -C output -cf - legal-info | xz -T0 > $GITHUB_WORKSPACE/axos-sources.tar.xz
          ls -la $GITHUB_WORKSPACE/axos-sources.tar.xz

      - name: Package
        run: |
          mkdir -p dist
          xz -T0 -c ~/buildroot/output/images/axos.img > dist/axos.img.xz
          mv axos-sources.tar.xz dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: axos-image
          path: dist/axos.img.xz

      - name: Publish as a pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: axos-dev-${{ github.run_number }}
          name: AXOS dev build ${{ github.run_number }}
          prerelease: true
          body: |
            Test image for the Raspberry Pi 3, built from ${{ github.sha }}.
            Flash axos.img.xz with Raspberry Pi Imager ("Use custom") onto a spare SD card.
            AXUS ${{ env.AXUS_TAG }}, checked against its sha256 (axus.lock).
            axos-sources.tar.xz: the licenses and the complete sources of every
            package in the image (GPL). AXOS and AXUS are GPL-3.0.
          files: |
            dist/axos.img.xz
            dist/axos-sources.tar.xz
