image boot.vfat {
	vfat {
		label = "AXOS"
		files = {
#BOOT_FILES#
		}
	}
	size = 64M
}

image storage.ext4 {
	ext4 {
		label = "storage"
	}
	size = 256M
	mountpoint = "/storage"
}

image axos.img {
	hdimage {
	}
	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}
	partition system {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
	partition storage {
		partition-type = 0x83
		image = "storage.ext4"
	}
}
